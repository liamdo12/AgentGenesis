[project]
name = "agentgenesis-api"
version = "0.1.0"
description = "Agent Genesis extraction backend: Teams MCP -> transcript + frames -> Claude draft stories."
readme = "README.md"
authors = [{ name = "liam" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "aiofiles>=24.1",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langdetect>=1.0.9",
    "anthropic>=0.104.1",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "respx>=0.21",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
